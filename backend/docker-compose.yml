services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: fila_virtual
      POSTGRES_USER: fila
      POSTGRES_PASSWORD: fila
    ports:
      - "5432:5432"
    volumes:
      - fila_pg:/var/lib/postgresql/data
  api:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgresql+psycopg://fila:fila@db:5432/fila_virtual
      JWT_SECRET: dev-only-change-me
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      - db
volumes:
  fila_pg:
